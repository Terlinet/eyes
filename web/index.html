<!DOCTYPE html>
<html lang="pt-br">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <title>TerlineT Eyes - Elite Vision</title>

  <meta name="description" content="TerlineT Eyes - Sistema de Governança e Visão Computacional de Elite.">
  <meta property="og:title" content="TerlineT Eyes">
  <meta property="og:image" content="previeweyes.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    body { background-color: #0F172A; margin: 0; overflow: hidden; }
    #pose-video {
      object-fit: cover;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
    .mirrored { transform: scaleX(-1); }
    flutter-view { z-index: 1; }
  </style>

  <script>
    let poseDetector;
    let videoElement;
    let poseCallback = null;
    let currentStream = null;
    let isRunning = false;

    window.initPoseDetector = () => {
      return new Promise((resolve, reject) => {
        try {
          poseDetector = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
          });
          poseDetector.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
          });
          poseDetector.onResults((results) => {
            if (poseCallback && results.poseLandmarks) {
              poseCallback(JSON.stringify(results.poseLandmarks));
            }
          });
          resolve(true);
        } catch (e) { reject(e); }
      });
    };

    async function cameraLoop() {
      if (!isRunning) return;
      if (videoElement && videoElement.readyState >= 2) {
        try {
          if (poseDetector) await poseDetector.send({ image: videoElement });
        } catch (e) {
          console.error("Erro no processamento da pose:", e);
        }
      }
      requestAnimationFrame(cameraLoop);
    }

    window.startCamera = async (facingMode) => {
      // Converte para string JS caso venha como objeto
      const mode = String(facingMode);
      console.log("Tentando iniciar câmera mode:", mode);

      if (isRunning) {
        await window.stopCamera();
      }

      if (!videoElement) {
        videoElement = document.createElement("video");
        videoElement.id = "pose-video";
        videoElement.autoplay = true;
        videoElement.muted = true;
        videoElement.setAttribute("playsinline", "true");
        document.body.appendChild(videoElement);
      }

      if (mode === "user") {
        videoElement.classList.add("mirrored");
      } else {
        videoElement.classList.remove("mirrored");
      }

      const constraints = {
        video: {
          facingMode: { ideal: mode },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = currentStream;
        isRunning = true;
        cameraLoop();
        return true;
      } catch (err) {
        console.error("Erro ao acessar a câmera:", err);
        // Fallback para qualquer câmera se a restrição falhar
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
          videoElement.srcObject = currentStream;
          isRunning = true;
          cameraLoop();
          return true;
        } catch (err2) {
          console.error("Falha total ao acessar câmera:", err2);
          return false;
        }
      }
    };

    window.captureFrame = () => {
      if (!videoElement || !isRunning) return "";
      const canvas = document.createElement("canvas");
      canvas.width = videoElement.videoWidth || 1280;
      canvas.height = videoElement.videoHeight || 720;
      const ctx = canvas.getContext("2d");
      if (videoElement.classList.contains("mirrored")) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg");
    };

    window.stopCamera = async () => {
      isRunning = false;
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
      if (videoElement) {
        videoElement.srcObject = null;
        videoElement.remove();
        videoElement = null;
      }
      return true;
    };

    window.setPoseCallback = (callback) => { poseCallback = callback; };

    window.downloadImage = (dataUrl, filename) => {
      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = filename;
      link.click();
    };

    // --- Voz e Reconhecimento ---
    let speechRecognition = null;
    let speechCallback = null;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      speechRecognition = new SpeechRecognition();
      speechRecognition.lang = 'pt-BR';
      speechRecognition.continuous = true;
      speechRecognition.interimResults = false;

      speechRecognition.onresult = (event) => {
        const text = event.results[event.results.length - 1][0].transcript;
        if (speechCallback) speechCallback(text);
      };
    }

    window.startListening = () => {
      if (speechRecognition) {
        try { speechRecognition.start(); } catch(e) { console.log("Reconhecimento já ativo ou erro."); }
      }
    };

    window.stopListening = () => {
      if (speechRecognition) {
        try { speechRecognition.stop(); } catch(e) {}
      }
    };

    window.setSpeechCallback = (callback) => { speechCallback = callback; };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
