<!DOCTYPE html>
<html lang="pt-br">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <title>TerlineT Eyes - Elite Vision</title>

  <meta name="description" content="TerlineT Eyes - Sistema de Governança e Visão Computacional de Elite.">
  <meta property="og:title" content="TerlineT Eyes">
  <meta property="og:image" content="previeweyes.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    body { background-color: #0F172A; margin: 0; overflow: hidden; }
    #pose-video {
      object-fit: cover;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
    .mirrored { transform: scaleX(-1); }
    flutter-view { z-index: 1; }
  </style>

  <script>
    let poseDetector;
    let cameraInstance = null;
    let videoElement;
    let poseCallback = null;

    window.initPoseDetector = () => {
      return new Promise((resolve, reject) => {
        try {
          poseDetector = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
          });
          poseDetector.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
          });
          poseDetector.onResults((results) => {
            if (poseCallback && results.poseLandmarks) {
              poseCallback(JSON.stringify(results.poseLandmarks));
            }
          });
          resolve(true);
        } catch (e) { reject(e); }
      });
    };

    window.startCamera = async (facingMode) => {
      if (cameraInstance) { await cameraInstance.stop(); }
      if (!videoElement) {
        videoElement = document.createElement("video");
        videoElement.id = "pose-video";
        videoElement.autoplay = true;
        videoElement.muted = true;
        videoElement.setAttribute("playsinline", "true");
        document.body.appendChild(videoElement);
      }
      if (facingMode === "user") { videoElement.classList.add("mirrored"); }
      else { videoElement.classList.remove("mirrored"); }

      cameraInstance = new Camera(videoElement, {
        onFrame: async () => { if (poseDetector) await poseDetector.send({ image: videoElement }); },
        facingMode: facingMode,
        width: 1280, height: 720
      });
      await cameraInstance.start();
      return true;
    };

    window.captureFrame = () => {
      if (!videoElement) return "";
      const canvas = document.createElement("canvas");
      canvas.width = videoElement.videoWidth;
      canvas.height = videoElement.videoHeight;
      const ctx = canvas.getContext("2d");
      // Se estiver espelhado, inverte o canvas para a foto ficar igual ao que se vê
      if (videoElement.classList.contains("mirrored")) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg");
    };

    window.stopCamera = () => {
      if (cameraInstance) cameraInstance.stop();
      if (videoElement) { videoElement.remove(); videoElement = null; }
    };

    window.setPoseCallback = (callback) => { poseCallback = callback; };

    window.downloadImage = (dataUrl, filename) => {
      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = filename;
      link.click();
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
